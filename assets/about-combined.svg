<svg width="620" height="220" viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, Consolas, monospace">
  <rect x="0" y="0" width="620" height="220" rx="12" fill="#1a1b27"/>
  <clipPath id="clip"><rect x="0" y="0" width="620" height="220" rx="12"/></clipPath>

  <g clip-path="url(#clip)" font-size="14" fill="#BB9AF7" opacity="0.28">
    <text x="10" y="-20"><animate attributeName="y" from="-30" to="240" dur="2.6s" repeatCount="indefinite"/>1</text>
    <text x="45" y="-20"><animate attributeName="y" from="-30" to="240" dur="3.1s" begin="0.3s" repeatCount="indefinite"/>0</text>
    <text x="270" y="-20"><animate attributeName="y" from="-30" to="240" dur="2.3s" begin="0.6s" repeatCount="indefinite"/>1</text>
    <text x="310" y="-20"><animate attributeName="y" from="-30" to="240" dur="3.4s" begin="0.1s" repeatCount="indefinite"/>0</text>
    <text x="350" y="-20"><animate attributeName="y" from="-30" to="240" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>1</text>
    <text x="440" y="-20"><animate attributeName="y" from="-30" to="240" dur="2.9s" begin="0.5s" repeatCount="indefinite"/>0</text>
    <text x="480" y="-20"><animate attributeName="y" from="-30" to="240" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>1</text>
    <text x="520" y="-20"><animate attributeName="y" from="-30" to="240" dur="3.2s" begin="0.7s" repeatCount="indefinite"/>0</text>
    <text x="560" y="-20"><animate attributeName="y" from="-30" to="240" dur="2.7s" begin="0.4s" repeatCount="indefinite"/>1</text>
    <text x="595" y="-20"><animate attributeName="y" from="-30" to="240" dur="3.0s" begin="0.8s" repeatCount="indefinite"/>0</text>
  </g>

  <!-- orbiting glow badge -->
  <circle cx="110" cy="110" r="42" fill="none" stroke="#BB9AF7" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="42;62;42" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="110" r="42" fill="none" stroke="#BB9AF7" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="42;62;42" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="110" r="38" fill="#1a1b27" stroke="#BB9AF7" stroke-width="3"/>
  <text x="110" y="120" font-size="26" font-weight="bold" fill="#c0caf5" text-anchor="middle">BT</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 110 110" to="360 110 110" dur="14s" repeatCount="indefinite"/>
    <circle cx="168" cy="110" r="8" fill="#F7DF1E"/>
    <circle cx="110" cy="52" r="8" fill="#3776AB"/>
    <circle cx="52" cy="110" r="8" fill="#3178C6"/>
    <circle cx="110" cy="168" r="8" fill="#00599C"/>
  </g>

  <!-- bio panel -->
  <rect x="200" y="45" width="380" height="130" rx="10" fill="#1a1b27" opacity="0.85" stroke="#414868"/>
  <text x="390" y="88" font-size="21" font-weight="bold" fill="#c0caf5" text-anchor="middle">Bibash — BCA Student</text>
  <text x="390" y="112" font-size="17" fill="#a9b1d6" text-anchor="middle">Tribhuvan University</text>
  <text x="390" y="138" font-size="16" fill="#a9b1d6" text-anchor="middle">Building projects to learn by doing</text>
  <text x="390" y="163" font-size="15" font-weight="bold" fill="#BB9AF7" text-anchor="middle">bibashthapa1432@gmail.com</text>
</svg>
